name: 缺陷
description: 已有功能不符合预期
labels: ["type/fix"]
body:
  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 实际发生了什么，预期是什么
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 …
        2. 点击 …
        3. 看到 …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      description: tag 或 commit 短号
    validations:
      required: false
